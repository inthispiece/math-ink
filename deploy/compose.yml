services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8787
      GATEWAY_DATABASE_PATH: /app/data/gateway.sqlite
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      MATHINK_DOMAIN: ${MATHINK_DOMAIN:?Set MATHINK_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
    restart: unless-stopped
volumes:
  gateway-data:
  caddy-data:
  caddy-config:
