name: Check MathInk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/upload-artifact@v4
        with:
          name: mathink-web-plugin
          path: dist/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build hosted application image
        run: docker build -f deploy/Dockerfile -t mathink-hosted:test .
      - name: Verify hosted entry without cloud credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mathink-hosted-smoke -p 127.0.0.1:18787:8787 mathink-hosted:test
          trap 'status=$?; if [ "$status" != 0 ]; then docker logs mathink-hosted-smoke; fi; docker rm -f mathink-hosted-smoke >/dev/null; exit "$status"' EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors --max-time 3 --retry-max-time 30 http://127.0.0.1:18787/health -o /tmp/mathink-health.json
          curl --fail --silent --show-error http://127.0.0.1:18787/ -o /tmp/mathink-index.html
          grep -q MathInk /tmp/mathink-index.html
          test "$(docker exec mathink-hosted-smoke id -u)" != 0
          test "$(curl --silent -o /tmp/mathink-private.json -w '%{http_code}' http://127.0.0.1:18787/v1/usage)" = 401
          test "$(curl --silent -o /tmp/mathink-pairing.json -w '%{http_code}' http://127.0.0.1:18787/v1/local-pairing)" = 403
          docker exec mathink-hosted-smoke node scripts/hosted-admin.mjs users
      - name: Validate HTTPS proxy configuration
        run: |
          docker run --rm -e MATHINK_DOMAIN=mathink.example.invalid --mount "type=bind,source=$PWD/deploy/Caddyfile,target=/etc/caddy/Caddyfile,readonly" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
