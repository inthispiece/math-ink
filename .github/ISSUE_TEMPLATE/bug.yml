name: 故障报告
description: 报告保存、手写或识别问题
body:
  - type: input
    id: version
    attributes:
      label: MathInk 版本或提交
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备、系统、手写笔
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期结果和实际结果
      description: 请勿提交 API 密钥或私人笔记；使用可公开的最小样例。
    validations:
      required: true
